

services:
  user-service:
    build: ./user-service
    container_name: user-service-app
    ports: 
      - "8081:8081"
    environment:
      # Iska naam wahi hona chahiye jo application.yaml mein ${} ke andar hai
      - MONGODB_URI=
      
      
      - JWT_SECRET=tKATROyt2Yb66TxRjagQ5lt5OmPdythS2oSHfw7wzb0=
      - JWT_EXPIRATION=86400000
      - JWT_REFRESH_EXPIRATION=604800000
      
      
      - CORS_ALLOWED_ORIGINS=*
      
      
      - SEED_ADMIN_EMAIL=admin@medicalerp.com
      - SEED_ADMIN_PASSWORD=Admin@123456
      - SEED_ORG_NAME=MedERP HQ
      - SEED_ORG_REG_NUMBER=HQ-0001
    networks:
      - my-network

  product-service:
     build: ./product-service
     ports: 
        - "8082:8082"
     container_name: product-service-app   
     environment:
        -  CORS_ALLOWED_ORIGINS=*
        -  MONGODB_URI=
        -  LOW_STOCK_THRESHOLD=10
        -  JWT_SECRET=tKATROyt2Yb66TxRjagQ5lt5OmPdythS2oSHfw7wzb0=
     networks:
        - my-network


  order-service: 
    build: ./order-service
    container_name: order-service-app
    ports:
      - "8083:8083"
    environment:
      - MONGODB_URI=
      - CORS_ALLOWED_ORIGINS=*
      - JWT_SECRET=tKATROyt2Yb66TxRjagQ5lt5OmPdythS2oSHfw7wzb0=
      - PRODUCT_SERVICE_URL=http://product-service-app:8082/api/v1
      - USER_SERVICE_URL=http://user-service-app:8081/api/v1
    networks:
      - my-network
    depends_on:
      -  user-service
      -  product-service

  frontend-service:
    build: ./frontend
    container_name: frontend-service-app
    ports: 
      - "80:80"
    environment:
       - VITE_USER_SERVICE_URL=/api/v1
       - VITE_PRODUCT_SERVICE_URL=/api/v1
       - VITE_ORDER_SERVICE_URL=/api/v1
       - VITE_PROXY_API_HOST=65.0.55.212
    networks:
     - my-network







     
networks:
  my-network:
    driver: bridge